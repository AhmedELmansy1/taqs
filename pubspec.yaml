name: taqs
description: "A production-grade Arabic-first weather app for Egypt."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_fonts: 6.2.1
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
