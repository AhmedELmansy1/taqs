<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Taqs Official Brand Logo (طقس) – Weather & Prayer Times Mark -->
  <defs>
    <!-- Deep Navy Base Gradient -->
    <linearGradient id="taqsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#070D1E" />
    </linearGradient>

    <!-- Electric Blue to Cyan Gradient (Weather / Sky / Dawn) -->
    <linearGradient id="taqsSky" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Refined Metallic Gold Gradient (Prayer / Crescent / Horizon Accent) -->
    <linearGradient id="taqsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Subtle Cyan Ambient Radial Glow -->
    <radialGradient id="taqsGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Navy Rounded Squircle Base (22% radius) -->
  <rect width="512" height="512" rx="112" fill="url(#taqsBg)" />

  <!-- Soft Ambient Luminous Halo behind sun & crescent -->
  <circle cx="280" cy="228" r="140" fill="url(#taqsGlow)" />

  <!-- Sun Disc: Weather / Solar cycle / Fajr dawn (Electric Blue to Cyan) -->
  <circle cx="280" cy="228" r="54" fill="url(#taqsSky)" />

  <!-- Golden Crescent: Islamic Prayer Times & Lunar Hijri cycle -->
  <path d="M 276 176 C 242 184 218 214 220 250 C 222 284 246 312 280 316 C 252 308 234 282 236 252 C 238 220 258 190 276 176 Z" fill="url(#taqsGold)" />

  <!-- Upright Mast (ألف الطاء) – Minaret finial and vertical dawn ray -->
  <path d="M 314 100 C 314 92 322 86 330 86 C 338 86 344 92 344 100 L 344 266 C 344 274 338 280 330 280 C 322 280 314 274 314 266 Z" fill="url(#taqsSky)" />

  <!-- Sweeping loop of the Arabic letter "ط" & Weather Horizon Wave -->
  <path d="M 124 344 C 154 244 260 216 364 248 C 404 260 428 288 438 328 C 420 336 384 340 348 338 C 266 332 216 268 174 308 C 152 330 138 342 124 344 Z" fill="url(#taqsSky)" />

  <!-- Horizon Wave Base (Egypt Nile / Sea / Desert Horizon) -->
  <path d="M 104 354 C 180 354 236 328 320 328 C 386 328 430 350 448 354 C 448 370 436 382 416 382 C 340 382 274 360 196 368 C 154 372 124 382 106 382 C 98 382 94 372 98 362 C 100 357 102 354 104 354 Z" fill="url(#taqsSky)" opacity="0.92" />

  <!-- Refined Metallic Gold Horizon Accent Line -->
  <path d="M 134 350 C 220 344 286 304 378 320" stroke="url(#taqsGold)" stroke-width="6" stroke-linecap="round" fill="none" />

  <!-- Subtle Celestial Stars -->
  <circle cx="164" cy="184" r="4" fill="#38BDF8" opacity="0.65" />
  <circle cx="410" cy="164" r="3.5" fill="#38BDF8" opacity="0.55" />
</svg>
