<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#070D1E" />
    </linearGradient>

    <!-- Main Cyan-Blue Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#D97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Navy Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="280" cy="220" r="140" fill="url(#sunGlow)" />

  <!-- Rising Sun Disc in upper-center -->
  <circle cx="290" cy="210" r="52" fill="url(#goldGrad)" />

  <!-- Stylized Arabic letter "ط" & Weather Horizon Wave -->
  <!-- Ascending Mast (ألف الطاء) with dynamic tapered aerodynamic curve -->
  <path d="M 284 104 C 284 96 292 90 300 90 C 308 90 314 96 314 104 L 314 260 C 314 268 308 274 300 274 C 292 274 284 268 284 260 Z" fill="url(#primaryGrad)" />

  <!-- The sweeping loop of the "ط" curving into a smooth atmospheric horizon arc -->
  <path d="M 120 340 C 150 240 250 220 350 250 C 400 265 430 300 440 340 C 420 346 380 348 340 344 C 260 336 210 270 170 310 C 150 330 135 340 120 340 Z" fill="url(#primaryGrad)" />

  <!-- Horizon Wave Line (Lower loop connection) -->
  <path d="M 104 350 C 170 350 220 320 300 320 C 370 320 420 348 448 350 C 448 368 436 382 416 382 C 340 382 270 358 190 366 C 150 370 120 380 104 380 C 96 380 92 370 96 360 C 98 354 100 350 104 350 Z" fill="url(#primaryGrad)" opacity="0.85" />

  <!-- Thin Metallic Gold Horizon Accent Arc -->
  <path d="M 130 348 C 220 340 280 290 380 310" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="none" />

  <!-- Subtle celestial highlight star -->
  <circle cx="168" cy="180" r="4" fill="#38BDF8" opacity="0.7" />
  <circle cx="396" cy="160" r="3" fill="#38BDF8" opacity="0.5" />
</svg>
