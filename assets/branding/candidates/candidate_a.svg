<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Candidate A: Fajr Sunrise & Crescent Over Horizon -->
  <defs>
    <linearGradient id="skyGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="goldGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cyanGradA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Deep Navy Base -->
  <rect width="512" height="512" rx="112" fill="#0B132B" />

  <!-- Rising Sun Disc (Weather / Dawn) -->
  <circle cx="256" cy="240" r="76" fill="url(#cyanGradA)" />

  <!-- Slender Golden Crescent (Prayer / Fajr time) embracing the sun disc -->
  <!-- Geometry uses smooth cubic curves with negative space separation -->
  <path d="M 230 148 C 300 156 348 214 344 286 C 340 346 294 394 228 402 C 298 388 344 326 332 254 C 322 198 280 156 230 148 Z" fill="url(#goldGradA)" />

  <!-- Clean Horizon Bar (Atmospheric dawn layer) -->
  <path d="M 112 336 C 160 330 210 326 256 326 C 302 326 352 330 400 336 C 400 348 392 358 376 358 C 300 358 212 358 136 358 C 120 358 112 348 112 336 Z" fill="#38BDF8" />

  <!-- Gentle Lower Reflection / Atmosphere Arc -->
  <path d="M 152 376 C 210 384 302 384 360 376 C 368 376 372 384 366 388 C 334 402 278 408 256 408 C 234 408 178 402 146 388 C 140 384 144 376 152 376 Z" fill="#0284C7" opacity="0.8" />
</svg>
